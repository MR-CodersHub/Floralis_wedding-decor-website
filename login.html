<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login | Floralis Luxury Florist</title>
  <meta name="description" content="Log in to your Floralis account to view your wedding decor estimates, scheduled consultations, and floral moodboards.">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-main);">

  <!-- Clean Header (Brand Logo & Controls Only - No Nav Bar) -->
  <header class="header">
    <div class="container header-inner" style="justify-content: space-between;">
      <a href="index.html" class="logo" style="font-size: 1.6rem; font-weight: 700;">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" width="28" height="28">
          <path d="M16 4C18.5 8.5 22 10 26 10C25 15.5 21.5 19 16 21C10.5 19 7 15.5 6 10C10 10 13.5 8.5 16 4Z"
            stroke-linecap="round" stroke-linejoin="round" />
          <path
            d="M16 11C17.5 13.5 19.5 14.5 22 14.5C21.5 17.5 19.5 19 16 20C12.5 19 10.5 17.5 10 14.5C12.5 14.5 14.5 13.5 16 11Z"
            stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="16" cy="15.5" r="2" fill="currentColor" />
        </svg>
        Floralis
      </a>

      <div class="header-actions">
        <!-- Dark/Light Theme Toggle -->
        <button id="themeToggleBtn" class="header-toggle-btn" aria-label="Toggle dark/light theme"
          title="Toggle Dark/Light Mode">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
            height="16">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>

        <!-- RTL/LTR Direction Toggle -->
        <button id="rtlToggleBtn" class="header-toggle-btn" aria-label="Toggle RTL layout" title="Toggle RTL/LTR Direction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M17 3l4 4-4 4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M7 21l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round" />
            <line x1="21" y1="7" x2="3" y2="7" stroke-linecap="round" />
            <line x1="21" y1="17" x2="3" y2="17" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Main Content -->
  <main style="flex: 1; padding: 3rem 0; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 460px;">
      <div class="auth-card"
        style="background:var(--bg-card); padding:2.5rem; border-radius:var(--radius-lg); border:1px solid var(--border-card); box-shadow:var(--shadow-md);">

        <!-- Clear Brand Logo & Header inside Card -->
        <div style="text-align:center; margin-bottom:2rem;">
          <a href="index.html" class="logo"
            style="font-size: 2.2rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.6rem; margin-bottom: 1.2rem; text-decoration: none;">
            <svg class="logo-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" width="34"
              height="34" style="color:var(--primary);">
              <path d="M16 4C18.5 8.5 22 10 26 10C25 15.5 21.5 19 16 21C10.5 19 7 15.5 6 10C10 10 13.5 8.5 16 4Z"
                stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M16 11C17.5 13.5 19.5 14.5 22 14.5C21.5 17.5 19.5 19 16 20C12.5 19 10.5 17.5 10 14.5C12.5 14.5 14.5 13.5 16 11Z"
                stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="16" cy="15.5" r="2" fill="currentColor" />
            </svg>
            <span style="font-family:var(--font-heading); color:var(--text-dark); letter-spacing:-0.02em;">Floralis</span>
          </a>
          <span class="section-badge" style="margin-bottom:0.6rem; display:block;">CLIENT PORTAL</span>
          <h1 style="font-family:var(--font-heading); font-size:2rem; color:var(--text-dark); margin-bottom:0.5rem;">
            Welcome Back
          </h1>
          <p style="color:var(--text-muted); font-size:0.92rem; line-height:1.5;">
            Log in to your Floralis account to access decor estimates and floral moodboards.
          </p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Login successful! Welcome back to Floralis.'); window.location.href='index.html';">
          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label" style="display:block; margin-bottom:0.4rem;">Email Address</label>
            <input type="email" class="form-control" placeholder="name@domain.com" required style="width:100%;">
          </div>

          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label" style="display:block; margin-bottom:0.4rem;">Password</label>
            <div class="password-input-wrap" style="position:relative; width:100%;">
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="width:100%; padding-right:2.8rem;">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password" title="Show password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; padding:0.4rem; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Keep me signed in & Forgot Password aligned on same row -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; gap:0.5rem; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <input type="checkbox" id="rememberMe" checked style="cursor:pointer;">
              <label for="rememberMe" style="font-size:0.85rem; color:var(--text-muted); cursor:pointer; user-select:none;">Keep me signed in</label>
            </div>
            <a href="#" onclick="alert('Password reset link has been sent to your email.'); return false;" style="font-size:0.85rem; color:var(--primary); text-decoration:none; font-weight:600;">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.9rem; font-size:0.95rem;">
            LOG IN TO FLORALIS
          </button>
        </form>

        <!-- Social Login Divider & Options -->
        <div style="display:flex; align-items:center; margin:1.75rem 0 1.25rem 0; gap:1rem;">
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
          <span style="font-size:0.78rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600;">Or continue with</span>
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
        </div>

        <div class="social-login-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0.75rem;">
          <button type="button" onclick="alert('Google login integration pending.');" class="social-btn" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.65rem 0.5rem; background:var(--bg-main); border:1px solid var(--border-card); border-radius:var(--radius-sm); color:var(--text-dark); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all 0.2s ease;">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.3 14.7c-.3-.8-.4-1.7-.4-2.7s.1-1.9.4-2.7L1.6 6.4C.6 8.4 0 10.1 0 12s.6 3.6 1.6 5.6l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16C3.5 19.8 7.4 23 12 23z"/>
            </svg>
            <span>Google</span>
          </button>

          <button type="button" onclick="alert('Facebook login integration pending.');" class="social-btn" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.65rem 0.5rem; background:var(--bg-main); border:1px solid var(--border-card); border-radius:var(--radius-sm); color:var(--text-dark); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all 0.2s ease;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>Facebook</span>
          </button>

          <button type="button" onclick="alert('Apple login integration pending.');" class="social-btn" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.65rem 0.5rem; background:var(--bg-main); border:1px solid var(--border-card); border-radius:var(--radius-sm); color:var(--text-dark); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all 0.2s ease;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-.97.04-2.15.65-2.85 1.47-.62.72-1.16 1.88-1.01 3 .09.01.21.02.32.02 1.09 0 2.21-.58 2.55-1.4z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div style="margin-top:2rem; text-align:center; padding-top:1.5rem; border-top:1px solid var(--border-subtle);">
          <p style="font-size:0.9rem; color:var(--text-muted);">
            Don't have an account?
            <a href="signup.html" style="color:var(--primary); font-weight:700; text-decoration:none; margin-left:0.3rem;">Sign
              Up Now</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Clean Minimal Copyright Note (No Main Footer) -->
  <div style="text-align:center; padding:1.2rem 0; color:var(--text-light); font-size:0.85rem;">
    © 2026 Floralis Luxury Florist & Wedding Design. All rights reserved.
  </div>

  <script src="js/main.js"></script>
</body>

</html>
